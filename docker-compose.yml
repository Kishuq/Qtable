# One cafe = one deployment. Copy this file per cafe, set CAFE slug + secrets, run:
#   docker compose -p brewhaven --env-file brewhaven.env up -d --build
services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://qrserve:qrserve@db:5432/qrserve?schema=public}
      JWT_SECRET: ${JWT_SECRET:?set a 48+ char secret}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set public https URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - db
    restart: unless-stopped
    # One cafe can never starve the host (or its neighbours): hard caps + auto-heal.
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrserve
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: qrserve
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
